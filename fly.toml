app = 'cinedikt'
primary_region = 'iad'

[build]

[env]
  API_ADDR = ':8080'
  WEB_DIR = '/app/web/dist'
  POSTHOG_HOST = 'https://us.i.posthog.com'
  TMDB_RATE_PER_SEC = '15'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 80

  [[http_service.checks]]
    grace_period = '45s'
    interval = '15s'
    method = 'GET'
    path = '/api/healthz'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
