<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Before any stylesheet, and deliberately not a module: a module
         is deferred, so the page would paint dark and then turn white
         in front of a reader who chose light. document.write is the
         only way to put theme-color in the head from here. -->
    <script>
      try {
        var p = localStorage.getItem('cinedikt.theme') || 'system';
        var t =
          p === 'system'
            ? matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
            : p;
        document.documentElement.dataset.theme = t;
        document.write(
          '<meta name="theme-color" id="theme-color" content="' +
            (t === 'light' ? '#f9f4ee' : '#13100d') +
            '">',
        );
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <noscript><meta name="theme-color" content="#13100d" /></noscript>
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cinedikt — a movie’s cast and directors, and everything they made</title>
    <meta
      name="description"
      content="Start from a movie and follow its cast and directors across a timeline of everything they went on to make."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cinedikt" />
    <meta property="og:title" content="Cinedikt — a movie’s cast and directors, and everything they made" />
    <meta
      property="og:description"
      content="Start from a movie and follow its cast and directors across a timeline of everything they went on to make."
    />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/og.png?v=4" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cinedikt — a movie’s cast and directors, and everything they made" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.png?v=4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The two poster hosts. OMDb's addresses are Amazon's, and they
         are most of the pictures; TMDb's are the fallback. -->
    <link rel="preconnect" href="https://m.media-amazon.com" />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <!-- Both faces, fetched alongside the stylesheet rather than after
         it, so the text is drawn once instead of being drawn and then
         rewrapped. Young Serif sets the headline, the wordmark and the
         card titles; Figtree is one variable file that covers every
         weight the interface uses. These are the Latin files the
         stylesheet below names: a preload for any other address would
         be a second download, not a head start. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="https://fonts.gstatic.com/s/youngserif/v2/3qTpojO2nS2VtkB3KtkQZ1t93kY6ah7E.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="https://fonts.gstatic.com/s/figtree/v9/_Xms-HUzqDCFdgfMm4S9DaRvzig.woff2"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
